<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Omega Drain Services</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; line-height: 1.6; color: #333; background-color: #f8f9fa; }
        nav { background-color: #1a1a1a; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        nav .logo { color: #fff; font-weight: bold; font-size: 1.5rem; text-decoration: none; }
        nav ul { list-style: none; margin: 0; padding: 0; display: flex; }
        nav ul li { margin-left: 20px; }
        nav ul li a { color: #ccc; text-decoration: none; }
        .content { max-width: 600px; margin: 4rem auto; padding: 2rem; background: #fff; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h1 { color: #0056b3; margin-top: 0; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #0056b3; color: white; border: none; padding: 12px 20px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; }
        button:hover { background-color: #004085; }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">🪠 Omega Drain Services</a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="contact.html" style="color: #fff;">Contact</a></li>
        </ul>
    </nav>
    <main class="content">
        <h1>Request Free Quote</h1>
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" required placeholder="(555) 000-0000">
            </div>
            <div class="form-group">
                <label for="msg">Issue Description</label>
                <textarea id="msg" rows="4" required placeholder="Describe the drainage or plumbing issue..."></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
    </main>
</body>
</html>
